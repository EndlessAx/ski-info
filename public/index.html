<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d141f;
    --bg-alt: #101a28;
    --surface: #16212f;
    --surface-hi: #1c2b3d;
    --line: #263548;
    --ice: #eaf2f6;
    --ice-dim: #9fb2c4;
    --slate: #5b6f85;
    --glow: #ff8a4c;
    --glow-dim: #cc6a34;
    --cold: #4fb3d9;
    --good: #6fcf97;
    --warn: #f2c14e;
    --bad: #e0685a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79,179,217,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,138,76,0.07), transparent 55%),
      var(--bg);
    color: var(--ice);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 40px 24px 80px;
  }
  .wrap{ max-width: 1080px; margin: 0 auto; }

  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap: wrap; gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px; margin-bottom: 28px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em;
    color: var(--glow); text-transform:uppercase; margin-bottom:8px;
  }
  h1{
    font-family:'Oswald', sans-serif; font-weight:700; font-size: 40px;
    letter-spacing: 0.01em; color: var(--ice); text-transform: uppercase;
    line-height: 1.05;
  }
  h1 span{ color: var(--ice-dim); font-weight: 500; }
  .updated{
    font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--slate);
    text-align:right; line-height:1.6;
  }
  .updated b{ color: var(--ice-dim); font-weight: 500; }
  .refresh-all{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    background: var(--surface); color: var(--cold); border:1px solid var(--line);
    border-radius:100px; padding:6px 14px; cursor:pointer; margin-top:8px;
  }
  .refresh-all:hover{ border-color: var(--cold); }
  .lang-toggle{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    background: var(--surface); color: var(--glow); border:1px solid var(--line);
    border-radius:100px; padding:6px 14px; cursor:pointer;
  }
  .lang-toggle:hover{ border-color: var(--glow); }

  .controls{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 28px; }
  .controls button{
    font-family:'JetBrains Mono', monospace; font-size:12px;
    background: var(--surface); color: var(--ice-dim);
    border: 1px solid var(--line); border-radius: 100px;
    padding: 8px 16px; cursor:pointer; transition: all .15s ease;
    letter-spacing: 0.02em;
  }
  .controls button:hover{ border-color: var(--cold); color: var(--ice); }
  .controls button.active{
    background: var(--glow); border-color: var(--glow); color: #1a0e06; font-weight: 600;
  }

  .region-block{ margin-bottom: 36px; }
  .region-block:last-child{ margin-bottom: 0; }
  .region-hd{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .region-label{ font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; letter-spacing:.03em; text-transform:uppercase; color: var(--ice-dim); }
  .region-origin{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--slate); }

  .grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  @media (max-width: 860px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 22px; position: relative; overflow: hidden;
    transition: border-color .2s ease, transform .2s ease;
  }
  .card:hover{ border-color: var(--cold); transform: translateY(-2px); }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, var(--cold), var(--glow));
    opacity:0; transition: opacity .2s ease;
  }
  .card:hover::before{ opacity: 1; }

  .resort-name{ font-family:'Oswald', sans-serif; font-weight:600; font-size:24px; text-transform: uppercase; letter-spacing: 0.01em; margin-bottom:2px; }
  .resort-meta{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--slate); margin-bottom: 16px; display:flex; gap:10px; align-items:center; }
  .drive-tag{ background: var(--bg-alt); border:1px solid var(--line); border-radius:4px; padding: 2px 8px; color: var(--ice-dim); }

  .gauge-row{ display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .gauge{ position: relative; width:64px; height:64px; flex-shrink:0; }
  .gauge svg{ transform: rotate(-90deg); }
  .gauge-bg{ fill:none; stroke: var(--line); stroke-width:6; }
  .gauge-fg{ fill:none; stroke-width:6; stroke-linecap:round; transition: stroke-dashoffset 1s ease; }
  .gauge-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; color: var(--ice); }
  .gauge-desc .num{ font-family:'Oswald', sans-serif; font-size:18px; color:var(--ice); }
  .gauge-desc .lbl{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--slate); text-transform:uppercase; letter-spacing:.05em;}

  .section-lbl{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color: var(--slate); display:flex; justify-content:space-between; align-items:center;
    border-top: 1px solid var(--line); padding-top:12px; margin-top:14px; margin-bottom:10px;
  }
  .section-lbl .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.live{ background: var(--good); box-shadow:0 0 6px var(--good); }
  .dot.manual{ background: var(--warn); }
  .edit-link{ cursor:pointer; color: var(--cold); background:none; border:none; font-family:'JetBrains Mono', monospace; font-size:10px; text-decoration:underline; }
  .edit-link:hover{ color: var(--ice); }

  .stats{ display:flex; flex-direction:column; gap:10px; }
  .stat{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; }
  .stat .k{ color: var(--slate); }
  .stat .v{ font-family:'JetBrains Mono', monospace; color: var(--ice); font-weight:500; }
  .stat .v.snow{ color: var(--cold); }
  .stat .v.next{ color: var(--glow); }
  .stat .v.muted{ color: var(--slate); }

  .snowbar{ height:6px; border-radius:3px; background: var(--bg-alt); overflow:hidden; margin-top:2px; }
  .snowbar-fill{ height:100%; background: linear-gradient(90deg, var(--cold), #8fd8f0); }

  .forecast-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .forecast-day{
    flex:0 0 auto; width:56px; text-align:center; background: var(--bg-alt);
    border:1px solid var(--line); border-radius:4px; padding:8px 2px;
    font-family:'JetBrains Mono', monospace;
  }
  .fd-dow{ font-size:10px; color: var(--slate); text-transform:uppercase; }
  .fd-icon{ font-size:18px; margin:4px 0; }
  .fd-temp{ font-size:11px; }
  .fd-temp .fd-max{ color: var(--ice); }
  .fd-temp .fd-min{ color: var(--slate); }
  .fd-snow{ font-size:10px; color: var(--cold); margin-top:4px; }
  .fd-snow.muted{ color: var(--slate); }

  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
  .tag{
    font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:.03em;
    background: var(--bg-alt); border:1px solid var(--line); color: var(--ice-dim);
    padding: 4px 9px; border-radius: 100px; text-transform:uppercase;
  }

  .src-link{ display:inline-block; margin-top:14px; font-family:'JetBrains Mono', monospace; font-size:10px; color: var(--slate); text-decoration:none; border-bottom:1px dotted var(--slate); }
  .src-link:hover{ color: var(--cold); border-color: var(--cold); }

  .cam-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:6px; }
  .cam-thumb{
    position:relative; aspect-ratio: 4/3; border-radius:4px; overflow:hidden;
    border:1px solid var(--line); cursor:pointer; background: var(--bg-alt);
  }
  .cam-thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition: transform .2s ease; }
  .cam-thumb:hover img{ transform: scale(1.06); }
  .cam-thumb:hover{ border-color: var(--cold); }
  .cam-thumb .cam-lbl{
    position:absolute; left:0; right:0; bottom:0; padding:3px 5px;
    background: linear-gradient(0deg, rgba(0,0,0,.65), transparent);
    font-family:'JetBrains Mono', monospace; font-size:9px; color:#fff; letter-spacing:.02em;
  }

  .live-grid{ display:none; grid-template-columns: repeat(2, 1fr); gap:8px; }
  .live-grid.open{ display:grid; }
  .live-tile{
    position:relative; aspect-ratio:16/9; border-radius:4px; overflow:hidden;
    border:1px solid var(--line); background: var(--bg-alt);
  }
  .live-tile iframe{ width:100%; height:100%; border:0; display:block; }
  .live-play{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; cursor:pointer; background: rgba(13,20,31,.4); border:none; width:100%; height:100%; padding:0;
  }
  .live-play .play-icon{
    width:36px; height:36px; border-radius:50%; background: var(--good); color:#0a1a12;
    display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 0 12px rgba(111,207,151,.5);
  }
  .live-play .live-lbl{ font-family:'JetBrains Mono', monospace; font-size:10px; color:#fff; letter-spacing:.02em; text-shadow:0 1px 3px rgba(0,0,0,.8); }
  .live-expand{
    position:absolute; top:6px; right:6px; z-index:2; width:26px; height:26px; border-radius:4px;
    background: rgba(13,20,31,.75); border:1px solid var(--line); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer;
  }
  .live-expand:hover{ border-color: var(--cold); background: rgba(13,20,31,.95); }

  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(6,10,16,.88);
    z-index:100; align-items:center; justify-content:center; padding:40px 20px;
  }
  .lightbox.open{ display:flex; }
  .lightbox-inner{ max-width:900px; width:100%; text-align:center; }
  .lightbox img{ max-width:100%; max-height:75vh; border-radius:6px; border:1px solid var(--line); }
  .lightbox iframe{ width:100%; aspect-ratio:16/9; max-height:75vh; border-radius:6px; border:1px solid var(--line); }
  .lightbox-cap{ margin-top:12px; font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--ice-dim); }
  .lightbox-close{
    position:absolute; top:20px; right:24px; background:none; border:none; color: var(--ice);
    font-size:28px; line-height:1; cursor:pointer;
  }

  .skeleton{ color: var(--slate); font-style: normal; }
  .err{ color: var(--bad); }

  .edit-form{ display:none; flex-direction:column; gap:8px; margin-top:10px; padding:12px; background: var(--bg-alt); border:1px solid var(--line); border-radius:4px; }
  .edit-form.open{ display:flex; }
  .edit-form label{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--slate); text-transform:uppercase; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .edit-form input{
    background: var(--surface); border:1px solid var(--line); color: var(--ice);
    font-family:'JetBrains Mono', monospace; font-size:12px; padding:5px 8px; border-radius:3px; width:90px;
  }
  .edit-form .row2{ display:flex; gap:8px; }
  .edit-form .save-btn{
    margin-top:4px; background: var(--glow); border:none; color:#1a0e06; font-weight:600;
    font-family:'JetBrains Mono', monospace; font-size:11px; padding:7px; border-radius:4px; cursor:pointer;
  }

  footer{
    margin-top: 40px; padding-top: 20px; border-top:1px solid var(--line);
    font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--slate); line-height: 1.8;
  }
  footer b{ color: var(--ice-dim); }
</style>
</head>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this) closeLightbox()">

  <footer id="footer"></footer>

</div>

    + `&hourly=snow_depth`
    + `&daily=snowfall_sum,weather_code,temperature_2m_max,temperature_2m_min`
    + `&timezone=${encodeURIComponent(TZ[r.region])}&past_days=3&forecast_days=7`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();

  let snowDepth = null, snowDepthUnit = "";
  if(data.hourly && data.hourly.time){
    const idx = data.hourly.time.indexOf(data.current.time);
    if(idx >= 0){
      snowDepth = data.hourly.snow_depth[idx];
      snowDepthUnit = data.hourly_units.snow_depth;
      // open-meteo returns snow_depth in metres by default
      if(snowDepthUnit === "m"){ snowDepth = snowDepth * 100; snowDepthUnit = "cm"; }
    }
  }

  // Split the daily snowfall series around today: 3 days before = recent,
  // 3 days after = forecast. Robust to array length via today's index.
  let recentSnow = null, next72 = null, snowfallUnit = "";
  let forecast7 = [];
  if(data.daily && data.daily.snowfall_sum && data.daily.time){
    const arr = data.daily.snowfall_sum;
    const today = data.current.time.slice(0,10);
    const ti = data.daily.time.indexOf(today);
    const sum = (a,b) => arr.slice(a,b).reduce((x,y)=>x+(y||0),0);
    if(ti >= 0){
      recentSnow = sum(Math.max(0,ti-3), ti);   // past 3 days
      next72 = sum(ti+1, ti+4);                  // next 3 days
      forecast7 = data.daily.time.slice(ti, ti+7).map((date, k) => ({
        date,
        code: data.daily.weather_code[ti+k],
        tmax: data.daily.temperature_2m_max[ti+k],
        tmin: data.daily.temperature_2m_min[ti+k],
        snowfall: data.daily.snowfall_sum[ti+k]
      }));
    }
    snowfallUnit = data.daily_units.snowfall_sum;
  }

  return {
    temp: data.current.temperature_2m,
    wind: data.current.wind_speed_10m,
    code: data.current.weather_code,
    time: data.current.time,
    snowDepth, snowDepthUnit,
    recentSnow, next72, snowfallUnit,
    forecast7
  };
}

function liftProxyUrl(r){
  return LIFT_PROXY_BASE.replace(/\/+$/, "") + "/" + r.liftKey;
}
async function fetchLiveLifts(r){
  const res = await fetch(liftProxyUrl(r));
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || "proxy returned ok:false");
  return data;
}

// Returns lift status for a resort. When the Worker has live data:
//   { live:true, open, total, detail, trails }
// otherwise (no liftKey, or fetch failed): { live:false }
function getLiftCounts(r){
  const live = liveLiftCache[r.id];
  if(live && live !== "error" && live.ok && live.lifts){
    return {
      open: live.lifts.open,
      total: live.lifts.total || 1,
      live: true,
      detail: live.detail,
      trails: live.trails
    };
  }
  return { live: false };
}

function gaugeSVG(pct, color){
  const rad = 26, c = 2*Math.PI*rad;
  const offset = c - (pct/100)*c;
  return `
    <div class="gauge">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle class="gauge-bg" cx="32" cy="32" r="${rad}"></circle>
        <circle class="gauge-fg" cx="32" cy="32" r="${rad}"
          stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
      </svg>
      <div class="gauge-label">${pct}%</div>
    </div>`;
}

function liveBlockHTML(r){
  const live = liveCache[r.id];
  if(live === "error"){
    return `
      <div class="stat"><span class="k err">${T().weatherFetchFailed}</span><span class="v"><button class="edit-link" onclick="retryOne('${r.id}')">${T().retry}</button></span></div>
    `;
  }
  if(!live){
    return `<div class="stat"><span class="k skeleton">${T().loadingWeather}</span><span class="v">···</span></div>`;
  }
  const [icon, desc] = wmoDesc(live.code);
  return `
    <div class="stat"><span class="k">${T().currentWeather}</span><span class="v">${icon} ${desc} · ${live.temp}°C</span></div>
    <div class="stat"><span class="k">${T().wind}</span><span class="v">${live.wind} km/h</span></div>
    <div class="stat"><span class="k">${T().modelSnowDepth}</span><span class="v snow">${live.snowDepth != null ? live.snowDepth.toFixed(0) + live.snowDepthUnit : T().noData}</span></div>
    <div class="stat"><span class="k">${T().snowfallPast}</span><span class="v snow">${live.recentSnow != null ? live.recentSnow.toFixed(1) + live.snowfallUnit : T().noData}</span></div>
    <div class="stat"><span class="k">${T().snowfallForecast}</span><span class="v next">${live.next72 != null ? live.next72.toFixed(1) + live.snowfallUnit : T().noData}</span></div>
  `;
}

function forecastRowHTML(r){
  const live = liveCache[r.id];
  if(live === "error" || !live) return "";
  if(!live.forecast7 || !live.forecast7.length) return "";
  return `
    <div class="section-lbl"><span><span class="dot live"></span>${T().forecast7}</span></div>
    <div class="forecast-row">
      ${live.forecast7.map((d, i) => {
        const [icon] = wmoDesc(d.code);
        const dow = i === 0 ? T().today : T().weekday[new Date(d.date).getDay()];
        return `
        <div class="forecast-day">
          <div class="fd-dow">${dow}</div>
          <div class="fd-icon">${icon}</div>
          <div class="fd-temp"><span class="fd-max">${Math.round(d.tmax)}°</span> <span class="fd-min">${Math.round(d.tmin)}°</span></div>
          <div class="fd-snow${d.snowfall > 0 ? "" : " muted"}">${d.snowfall > 0 ? d.snowfall.toFixed(1) + "cm" : "-"}</div>
        </div>`;
      }).join("")}
    </div>`;
}

function liftAreasHTML(r){
  const counts = getLiftCounts(r);
  if(!counts.live || !counts.detail) return "";
  return `
    <div class="edit-form" id="lifts-${r.id}">
      ${counts.detail.map(g => `
        <div style="margin-bottom:8px;">
          <div style="font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--slate); text-transform:uppercase; margin-bottom:4px;">${g.group}</div>
          ${g.items.map(l => {
            const s = l.status.toLowerCase();
            const color = s === "open" ? "var(--good)" : (s.includes("hold") || s === "busy" || s === "on standby") ? "var(--warn)" : "var(--slate)";
            return `<div class="stat" style="font-size:12px;"><span class="k">${l.name}</span><span class="v" style="color:${color};">${l.status}${l.hours ? ` · ${l.hours}` : ""}</span></div>`;
          }).join("")}
        </div>
      `).join("")}
    </div>`;
}

function liftSectionHTML(r){
  const counts = getLiftCounts(r);
  if(counts.live){
    const liftPct = Math.round((counts.open / counts.total) * 100);
    const gaugeColor = liftPct > 50 ? "var(--good)" : liftPct > 20 ? "var(--warn)" : "var(--glow)";
    return `
    <div class="gauge-row">
      ${gaugeSVG(liftPct, gaugeColor)}
      <div class="gauge-desc">
        <div class="num">${counts.open} / ${counts.total}</div>
        <div class="lbl">${T().liftsOpen}</div>
      </div>
    </div>

    <div class="section-lbl">
      <span><span class="dot live"></span>${liftStatusLiveHeadingText(r)}</span>
      <button class="edit-link" onclick="toggleLiftDetail('${r.id}')">${T().details}</button>
    </div>
    ${counts.trails ? `<div class="stats"><div class="stat"><span class="k">${T().trailsOpen}</span><span class="v">${trailsOpenText(counts)}</span></div></div>` : ""}
    ${liftAreasHTML(r)}`;
  }
  // Show "loading" only while a proxy fetch is genuinely in flight; otherwise
  // (no liftKey, proxy disabled, or fetch failed) link out to the official page.
  const loading = liftProxyEnabled && r.liftKey && liveLiftCache[r.id] === undefined;
  const msg = loading
    ? `<span class="k skeleton">${T().loadingLifts}</span>`
    : `<span class="k">${T().liveLiftStatus}</span><span class="v"><a class="src-link" href="${r.sourceUrl}" target="_blank" rel="noopener" style="margin:0;border:none;">${T().seeOfficial}</a></span>`;
  return `
    <div class="section-lbl"><span><span class="dot manual"></span>${T().liftStatus}</span></div>
    <div class="stats"><div class="stat">${msg}</div></div>`;
}

// camBase+file sometimes already has its own "?query=" (e.g. Cardrona's
// ?view=1, Hotham's ?format=webp) — pick "&" instead of "?" so we don't
// clobber it with a second "?".
function camUrl(r, c, ts){
  const base = `${r.camBase}${c.file}`;
  return `${base}${base.includes("?") ? "&" : "?"}ts=${ts}`;
}
function camGridHTML(r){
  if(!r.cams || !r.cams.length) return "";
  const ts = camTs;
  return `
    <div class="cam-grid">
      ${r.cams.map((c, i) => `
        <div class="cam-thumb" onclick="openLightbox('${r.id}', ${i})">
          <img src="${camUrl(r, c, ts)}" alt="${c.name}" loading="lazy">
          <div class="cam-lbl">${c.name}</div>
        </div>
      `).join("")}
    </div>`;
}

function openLightbox(resortId, i){
  const r = resorts.find(x => x.id === resortId);
  const c = r.cams[i];
  const img = document.getElementById("lightboxImg");
  img.style.display = "block";
  img.src = camUrl(r, c, Date.now());
  document.getElementById("lightboxFrame").style.display = "none";
  document.getElementById("lightboxFrame").src = "";
  document.getElementById("lightboxCap").textContent = `${r.name} · ${c.name}`;
  document.getElementById("lightbox").classList.add("open");
}
function openLightboxVideo(embedUrl, caption){
  document.getElementById("lightboxImg").style.display = "none";
  document.getElementById("lightboxImg").src = "";
  const frame = document.getElementById("lightboxFrame");
  frame.style.display = "block";
  frame.src = embedUrl;
  document.getElementById("lightboxCap").textContent = caption;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightboxFrame").src = ""; // stop playback
}
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") closeLightbox();
});

function liveCamEmbedUrl(c){
  if(c.type === "youtube") return `https://www.youtube.com/embed/${c.id}?autoplay=1&mute=1`;
  if(c.type === "twitch"){
    const parent = location.hostname || "localhost"; // Twitch rejects an empty parent (e.g. file:// pages)
    return `https://player.twitch.tv/?channel=${c.channel}&parent=${parent}&muted=true&autoplay=true`;
  }
  return "";
}
function liveGridHTML(r){
  if(!r.liveCams || !r.liveCams.length) return "";
  return `
    <div class="section-lbl">
      <span><span class="dot live"></span>${liveHeadingText(r)}</span>
      <button class="edit-link" onclick="toggleLiveGrid('${r.id}')" id="live-toggle-${r.id}">${T().expand}</button>
    </div>
    <div class="live-grid" id="live-grid-${r.id}">
      ${r.liveCams.map((c, i) => `
        <div class="live-tile" id="live-tile-${r.id}-${i}">
          <button class="live-play" onclick="playLiveCam('${r.id}', ${i})">
            <span class="play-icon">▶</span>
            <span class="live-lbl">${c.name}</span>
          </button>
        </div>
      `).join("")}
    </div>`;
}
function toggleLiveGrid(id){
  const grid = document.getElementById(`live-grid-${id}`);
  const btn = document.getElementById(`live-toggle-${id}`);
  const open = grid.classList.toggle("open");
  btn.textContent = open ? T().collapse : T().expand;
}
function playLiveCam(resortId, i){
  const r = resorts.find(x => x.id === resortId);
  const c = r.liveCams[i];
  const url = liveCamEmbedUrl(c);
  const caption = `${r.name} · ${c.name}`;
  const el = document.getElementById(`live-tile-${resortId}-${i}`);
  el.innerHTML = `
    <iframe src="${url}" allow="autoplay; fullscreen" allowfullscreen title="${c.name}"></iframe>
    <button class="live-expand" onclick="openLightboxVideo('${url}', '${caption}')" title="${T().expandTitle}">⛶</button>
  `;
}

function cardHTML(r){
  const nameLine = lang === "zh" && r.cn ? `<span>${r.cn}</span> · ` : "";
  const tags = lang === "zh" && r.tagsZh ? r.tagsZh : r.tags;
  return `
  <div class="card" data-id="${r.id}">
    <div class="resort-name">${r.name}</div>
    <div class="resort-meta">${nameLine}<span class="drive-tag">🚗 ${driveTagText(r)}</span></div>

    ${liftSectionHTML(r)}

    <div class="section-lbl"><span><span class="dot live"></span>${T().liveWeather}</span></div>
    <div class="stats" id="live-${r.id}">
      ${liveBlockHTML(r)}
    </div>
    <div id="forecast-${r.id}">
      ${forecastRowHTML(r)}
    </div>

    ${liveGridHTML(r)}

    <div class="section-lbl"><span><span class="dot live"></span>${camsHeadingText(r)}</span></div>
    ${camGridHTML(r)}
    <a class="src-link" href="${r.camUrl}" target="_blank" rel="noopener" style="display:block; margin-top:${r.cams ? "10px" : "0"}; margin-bottom:4px;">${webcamPageLinkText(r)}</a>

    <div class="tag-row">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    <div>
      <a class="src-link" href="${r.sourceUrl}" target="_blank" rel="noopener">${T().officialSnowReport}</a>
      ${r.trailMapUrl ? `<a class="src-link" href="${r.trailMapUrl}" target="_blank" rel="noopener" style="margin-left:14px;">${T().trailMap}</a>` : ""}
    </div>
  </div>`;
}

let currentSort = "default";

const REGION_KEYS = ["nsw", "vic", "nz"];

function sortList(list){
  if(currentSort === "lifts") list.sort((a,b) => {
    const ca = getLiftCounts(a), cb = getLiftCounts(b);
    const ra = ca.live ? ca.open/ca.total : -1;   // resorts without live data sort last
    const rb = cb.live ? cb.open/cb.total : -1;
    return rb - ra;
  });
  if(currentSort === "snow") list.sort((a,b) => {
    const la = liveCache[a.id], lb = liveCache[b.id];
    const da = (la && la !== "error" && la.snowDepth) || 0;
    const db = (lb && lb !== "error" && lb.snowDepth) || 0;
    return db - da;
  });
  if(currentSort === "drive") list.sort((a,b) => a.driveMin - b.driveMin);
  return list;
}

function render(){
  document.getElementById("regionsWrap").innerHTML = REGION_KEYS.map(key => {
    const list = sortList(resorts.filter(r => r.region === key));
    if(!list.length) return "";
    const label = T().regionLabels[key], origin = T().regionOrigins[key];
    return `
      <div class="region-block">
        <div class="region-hd"><span class="region-label">${label}</span><span class="region-origin">${origin}</span></div>
        <div class="grid">${list.map(cardHTML).join("")}</div>
      </div>`;
  }).join("");
}

function toggleLiftDetail(id){
  const el = document.getElementById("lifts-" + id);
  el.classList.toggle("open");
}

async function retryOne(id){
  const r = resorts.find(x => x.id === id);
  delete liveCache[id];
  document.getElementById("live-" + id).innerHTML = liveBlockHTML(r);
  try{
    liveCache[id] = await fetchLive(r);
  }catch(e){
    liveCache[id] = "error";
  }
  document.getElementById("live-" + id).innerHTML = liveBlockHTML(r);
  document.getElementById("forecast-" + id).innerHTML = forecastRowHTML(r);
  if(liftProxyEnabled && r.liftKey) await retryLifts(id);
}

async function retryLifts(id){
  const r = resorts.find(x => x.id === id);
  if(!liftProxyEnabled || !r.liftKey) return;
  try{
    liveLiftCache[id] = await fetchLiveLifts(r);
  }catch(e){
    liveLiftCache[id] = "error";
  }
  render();
}

let lastWeatherUpdate = null;
async function loadAllLive(){
  document.getElementById("fetchTime").textContent = T().loadingWeather;
  camTs = Date.now();
  await Promise.all(resorts.map(async (r) => {
    try{
      liveCache[r.id] = await fetchLive(r);
    }catch(e){
      liveCache[r.id] = "error";
    }
    const el = document.getElementById("live-" + r.id);
    if(el) el.innerHTML = liveBlockHTML(r);
    const fel = document.getElementById("forecast-" + r.id);
    if(fel) fel.innerHTML = forecastRowHTML(r);

    if(liftProxyEnabled && r.liftKey){
      try{
        liveLiftCache[r.id] = await fetchLiveLifts(r);
      }catch(e){
        liveLiftCache[r.id] = "error";
      }
    }
  }));
  render();
  lastWeatherUpdate = new Date();
  document.getElementById("fetchTime").textContent = T().weatherUpdated + " " + lastWeatherUpdate.toLocaleTimeString(lang === "zh" ? "zh-CN" : "en-AU", {hour:'2-digit', minute:'2-digit'});
}

// Applies the current `lang` to every static UI string, then re-renders the
// resort cards (which pulls fresh T() text into liveBlockHTML/forecastRowHTML
// etc. via cardHTML). Any expanded live-video tile collapses back on toggle —
// an acceptable trade-off for keeping this simple.
function applyLang(){
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = T().docTitle;
  document.getElementById("eyebrow").textContent = T().eyebrow;
  document.getElementById("h1title").innerHTML = `${T().h1a} <span>${T().h1b}</span>`;
  document.getElementById("langToggle").textContent = T().langToggle;
  document.getElementById("refreshAll").textContent = T().refresh;
  document.getElementById("footer").innerHTML = T().footerHtml;
  const sortBtns = document.querySelectorAll(".controls button");
  sortBtns[0].textContent = T().sortDefault;
  sortBtns[1].textContent = T().sortLifts;
  sortBtns[2].textContent = T().sortSnow;
  sortBtns[3].textContent = T().sortDrive;
  render();
  document.getElementById("fetchTime").textContent = lastWeatherUpdate
    ? T().weatherUpdated + " " + lastWeatherUpdate.toLocaleTimeString(lang === "zh" ? "zh-CN" : "en-AU", {hour:'2-digit', minute:'2-digit'})
    : T().loadingWeather;
}
function setLang(l){
  lang = l;
  localStorage.setItem("skiInfoLang", l);
  applyLang();
}

document.getElementById("controls").addEventListener("click", (e) => {
  if(e.target.tagName !== "BUTTON") return;
  [...document.querySelectorAll(".controls button")].forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  currentSort = e.target.dataset.sort;
  render();
});
document.getElementById("refreshAll").addEventListener("click", loadAllLive);
document.getElementById("langToggle").addEventListener("click", () => setLang(lang === "en" ? "zh" : "en"));

applyLang();
loadAllLive();
</script>
</body>
</html>
